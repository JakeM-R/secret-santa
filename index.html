<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Secret Santa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --red-a:#8b0000; --red-b:#5c0000;
    --green:#123a24; --green-lo:#1a4d2e; --green-hi:#1f6b3a;
    --gold:#e7c86a; --gold-mid:#d9b24a; --gold-deep:#c39b2e;
    --cream:#f5efe2; --cream-hi:#fbf6ea; --cream-lo:#f0e7d1;
    --pink:#f0c9ce;
  }
  html{background:var(--red-b);}
  body{
    font-family:'Karla',system-ui,sans-serif;
    background:linear-gradient(160deg,var(--red-a) 0%,var(--red-b) 100%);
    background-attachment:fixed;
    min-height:100vh;min-height:100dvh;
    color:var(--cream);
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* snow behind everything */
  #snow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .flake{position:absolute;top:-14px;border-radius:50%;background:rgba(255,255,255,.85);
    animation:fall linear infinite;}
  @keyframes fall{to{transform:translateY(105vh);}}

  main{position:relative;z-index:1;flex:1;
    width:100%;max-width:460px;margin:0 auto;
    padding:clamp(28px,7vh,64px) 22px calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;}

  /* ---------- brand ---------- */
  .brand{text-align:center;margin-bottom:clamp(30px,6vh,52px);}
  .brand-mark{display:inline-flex;align-items:center;justify-content:center;
    width:50px;height:50px;border:1.5px solid var(--gold);border-radius:50%;
    color:var(--gold);margin-bottom:16px;}
  .brand h1{font-family:'Playfair Display';font-weight:700;
    font-size:clamp(30px,9vw,38px);color:var(--cream);letter-spacing:-.01em;line-height:1;}

  /* ---------- fields ---------- */
  .field{margin-bottom:20px;}
  .field-label{font-family:'Karla';font-size:12px;font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;color:var(--pink);
    margin-bottom:10px;}

  input[type=email]{width:100%;padding:16px;font-size:16px;font-family:'Karla';
    color:#fff;background:rgba(255,255,255,.09);
    border:1.5px solid rgba(255,255,255,.22);border-radius:13px;
    transition:border-color .2s,background .2s;}
  input[type=email]::placeholder{color:#d8b6ba;}
  input[type=email]:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.14);}

  /* ---------- custom select ---------- */
  .select{position:relative;}
  .select-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:16px;background:rgba(255,255,255,.09);
    border:1.5px solid rgba(255,255,255,.22);border-radius:13px;cursor:pointer;
    font-family:'Playfair Display';font-size:17px;color:#f0e6d8;text-align:left;
    transition:border-color .2s,background .2s;}
  .select-trigger:hover{background:rgba(255,255,255,.13);}
  .select.open .select-trigger{border-color:var(--gold);background:rgba(255,255,255,.14);color:#fff;}
  .select-trigger .chev{flex-shrink:0;transition:transform .25s;color:var(--gold);}
  .select.open .select-trigger .chev{transform:rotate(180deg);}
  .select-trigger.placeholder{color:#e7c6bf;}

  .select-menu{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:30;
    list-style:none;background:linear-gradient(180deg,var(--green-lo) 0%,var(--green) 100%);
    border:1.5px solid var(--gold-mid);border-radius:14px;overflow:hidden;
    box-shadow:0 22px 44px -12px rgba(0,0,0,.6);
    max-height:min(58vh,340px);overflow-y:auto;
    opacity:0;transform:translateY(-6px) scale(.99);transform-origin:top;
    pointer-events:none;transition:opacity .18s,transform .18s;}
  .select.open .select-menu{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .opt{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 16px;font-family:'Playfair Display';font-size:16px;color:var(--cream);
    cursor:pointer;border-bottom:1px solid rgba(231,200,106,.2);transition:background .12s;}
  .opt:last-child{border-bottom:none;}
  .opt:hover{background:rgba(255,255,255,.07);}
  .opt.selected{background:rgba(255,255,255,.11);}
  .opt .tick{opacity:0;color:var(--gold);flex-shrink:0;}
  .opt.selected .tick{opacity:1;}

  /* ---------- reveal button ---------- */
  .reveal-btn{position:relative;width:100%;margin-top:12px;padding:19px 16px;
    background:var(--green);color:#f7f0e2;border:none;border-radius:15px;cursor:pointer;
    font-family:'Playfair Display';font-weight:700;font-size:17px;letter-spacing:.01em;
    box-shadow:0 13px 26px -10px rgba(0,0,0,.6);
    transition:transform .18s,box-shadow .18s;overflow:hidden;}
  .reveal-btn::before{content:"";position:absolute;inset:5px;border:1px solid rgba(231,200,106,.6);
    border-radius:10px;pointer-events:none;}
  .reveal-btn span{position:relative;}
  .reveal-btn:hover{transform:translateY(-2px);box-shadow:0 18px 32px -12px rgba(0,0,0,.7);}
  .reveal-btn:active{transform:translateY(0);}
  .reveal-btn:disabled{cursor:default;opacity:.75;transform:none;}

  .error{margin-top:16px;padding:14px 16px;border-radius:12px;text-align:center;
    background:rgba(255,255,255,.1);border:1.5px solid var(--gold-mid);
    color:#ffe9c9;font-size:14px;font-weight:600;}

  /* ---------- reveal section ---------- */
  #reveal-section{flex:1;display:flex;flex-direction:column;text-align:center;}
  .giving{font-family:'Karla';font-size:12px;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--gold);}
  .cards{display:flex;flex-direction:column;gap:16px;margin:auto 0;}

  .flip{perspective:1200px;cursor:pointer;height:132px;-webkit-tap-highlight-color:transparent;}
  .flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .85s cubic-bezier(.4,0,.2,1);}
  .flip.flipped .flip-inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:1.5px solid var(--gold-mid);box-shadow:0 14px 30px -16px rgba(0,0,0,.6);}
  /* front = wrapped */
  .face.front{background:linear-gradient(180deg,var(--green-lo) 0%,var(--green) 100%);}
  .face.front::before{content:"";position:absolute;inset:5px;border:1px solid rgba(231,200,106,.5);
    border-radius:9px;pointer-events:none;}
  .face.front .gift{color:var(--gold);animation:breathe 1.8s ease-in-out infinite;}
  .flip.flipped .face.front .gift{animation:none;}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
  .face.front .person{margin-top:10px;font-family:'Karla';font-size:11px;font-weight:700;
    letter-spacing:.28em;text-transform:uppercase;color:var(--gold);}
  /* back = revealed plaque */
  .face.back{transform:rotateY(180deg);overflow:hidden;
    background:linear-gradient(180deg,var(--cream-hi) 0%,var(--cream-lo) 100%);
    box-shadow:inset 0 0 0 4px #f7f0dd,inset 0 0 0 5px rgba(217,178,74,.5),
      inset 0 1px 0 rgba(255,255,255,.85),0 14px 30px -16px rgba(0,0,0,.6);}
  /* reveal effect: pop + gold glow + shimmer sweep */
  .flip.flipped{animation:pop .55s ease;}
  @keyframes pop{0%{transform:scale(1);}42%{transform:scale(1.045);}100%{transform:scale(1);}}
  .flip.flipped .face.back{animation:glow 1.1s ease .45s;}
  @keyframes glow{
    0%{box-shadow:inset 0 0 0 4px #f7f0dd,inset 0 0 0 5px rgba(217,178,74,.5),inset 0 1px 0 rgba(255,255,255,.85),0 0 0 0 rgba(231,200,106,.75),0 14px 30px -16px rgba(0,0,0,.6);}
    100%{box-shadow:inset 0 0 0 4px #f7f0dd,inset 0 0 0 5px rgba(217,178,74,.5),inset 0 1px 0 rgba(255,255,255,.85),0 0 0 26px rgba(231,200,106,0),0 14px 30px -16px rgba(0,0,0,.6);}}
  .face.back::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.6) 50%,transparent 66%);
    transform:translateX(-130%);}
  .flip.flipped .face.back::after{animation:sheen 1s ease .5s;}
  @keyframes sheen{to{transform:translateX(130%);}}
  .rule-label{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--gold-deep);}
  .rule-label::before,.rule-label::after{content:"";width:16px;height:1px;background:currentColor;}
  .rule-label span{font-family:'Karla';font-size:9.5px;font-weight:700;letter-spacing:.28em;
    text-transform:uppercase;color:#9b1c2e;}
  .face.back .name{font-family:'Playfair Display';font-weight:700;font-size:clamp(30px,8vw,38px);
    color:var(--green);line-height:1.05;margin-top:6px;}

  .hint{margin-top:6px;font-family:'Playfair Display';font-style:italic;font-size:16px;
    color:#f0d9b0;transition:opacity .3s;}
  .confirm{margin-top:6px;border-top:1px solid rgba(255,255,255,.2);padding-top:20px;
    opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s;}
  .confirm.show{opacity:1;transform:translateY(0);}
  .confirm .merry{font-family:'Playfair Display';font-style:italic;font-weight:600;font-size:19px;color:var(--cream);}
  .confirm .sub{font-family:'Karla';font-size:13px;color:#e9bfc3;margin-top:7px;}

  .fade-in{animation:fadeIn .5s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  [hidden]{display:none !important;}
</style>
</head>
<body>
  <div id="snow"></div>

  <main>
    <!-- ENTRY -->
    <section id="form-section">
      <header class="brand">
        <div class="brand-mark">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="9" width="17" height="11.5" rx="1.5"/><path d="M3.5 13h17"/><path d="M12 9v11.5"/><circle cx="9" cy="6.4" r="2.3"/><circle cx="15" cy="6.4" r="2.3"/><path d="M12 9c-.7-1.6-2-2.6-3-2.6M12 9c.7-1.6 2-2.6 3-2.6"/></svg>
        </div>
        <h1>Secret Santa</h1>
      </header>

      <div class="field">
        <div class="field-label">Who are you?</div>
        <div class="select" id="select">
          <button type="button" class="select-trigger placeholder" id="select-trigger" aria-haspopup="listbox" aria-expanded="false">
            <span id="select-label">Select your name</span>
            <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <ul class="select-menu" id="select-menu" role="listbox" aria-label="Choose your name"></ul>
        </div>
      </div>

      <div class="field">
        <div class="field-label">Your email</div>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" inputmode="email">
      </div>

      <button type="button" class="reveal-btn" id="reveal-btn"><span>Reveal my picks</span></button>
      <div class="error" id="form-error" hidden></div>
    </section>

    <!-- REVEAL -->
    <section id="reveal-section" hidden>
      <div class="giving">You're giving gifts to</div>
      <div class="cards">
        <div class="flip" id="flip1" data-idx="1" role="button" tabindex="0" aria-label="Reveal first person">
          <div class="flip-inner">
            <div class="face front">
              <svg class="gift" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3.5" y="9" width="17" height="11.5" rx="1.5"/><path d="M3.5 13h17"/><path d="M12 9v11.5"/><circle cx="9" cy="6.4" r="2.3"/><circle cx="15" cy="6.4" r="2.3"/><path d="M12 9c-.7-1.6-2-2.6-3-2.6M12 9c.7-1.6 2-2.6 3-2.6"/></svg>
              <span class="person">Person 1</span>
            </div>
            <div class="face back">
              <div class="rule-label"><span>Person 1</span></div>
              <div class="name" id="name1"></div>
            </div>
          </div>
        </div>
        <div class="flip" id="flip2" data-idx="2" role="button" tabindex="0" aria-label="Reveal second person">
          <div class="flip-inner">
            <div class="face front">
              <svg class="gift" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3.5" y="9" width="17" height="11.5" rx="1.5"/><path d="M3.5 13h17"/><path d="M12 9v11.5"/><circle cx="9" cy="6.4" r="2.3"/><circle cx="15" cy="6.4" r="2.3"/><path d="M12 9c-.7-1.6-2-2.6-3-2.6M12 9c.7-1.6 2-2.6 3-2.6"/></svg>
              <span class="person">Person 2</span>
            </div>
            <div class="face back">
              <div class="rule-label"><span>Person 2</span></div>
              <div class="name" id="name2"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="hint" id="hint">Tap a card to see your picks</div>
      <div class="confirm" id="confirm" hidden>
        <div class="merry" id="merry"></div>
        <div class="sub">A copy is on its way to your inbox.</div>
      </div>
    </section>
  </main>

<script>
  const API_URL = 'https://soft-sea-388e.j-makkingrobinson.workers.dev';
  const isMobile = window.innerWidth < 600;
  let selectedName = '';
  let flippedCount = 0;

  /* ---------- snow ---------- */
  (function snow(){
    const box = document.getElementById('snow');
    const n = isMobile ? 34 : 70;
    let html = '';
    for(let i=0;i<n;i++){
      const size = (Math.random()*4+2).toFixed(1);
      const left = (Math.random()*100).toFixed(2);
      const dur = (Math.random()*4+4).toFixed(2);
      const delay = (Math.random()*6).toFixed(2);
      const op = (Math.random()*.45+.4).toFixed(2);
      html += `<div class="flake" style="left:${left}%;width:${size}px;height:${size}px;`
            + `opacity:${op};animation-duration:${dur}s;animation-delay:-${delay}s;"></div>`;
    }
    box.innerHTML = html;
  })();

  /* ---------- custom select ---------- */
  const select = document.getElementById('select');
  const trigger = document.getElementById('select-trigger');
  const menu = document.getElementById('select-menu');
  const labelEl = document.getElementById('select-label');

  function openMenu(o){
    select.classList.toggle('open', o);
    trigger.setAttribute('aria-expanded', o ? 'true':'false');
  }
  trigger.addEventListener('click', (e)=>{ e.stopPropagation(); openMenu(!select.classList.contains('open')); });
  document.addEventListener('click', (e)=>{ if(!select.contains(e.target)) openMenu(false); });

  const tickSVG = '<svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l5 5L20 6"/></svg>';

  async function loadFamily(){
    try{
      const res = await fetch(`${API_URL}/api/family`);
      const family = await res.json();
      menu.innerHTML = family.map(m =>
        `<li class="opt" role="option" data-value="${m.name}"><span>${m.name}</span>${tickSVG}</li>`
      ).join('');
      menu.querySelectorAll('.opt').forEach(li=>{
        li.addEventListener('click', ()=>{
          menu.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));
          li.classList.add('selected');
          li.setAttribute('aria-selected','true');
          selectedName = li.dataset.value;
          labelEl.textContent = selectedName;
          trigger.classList.remove('placeholder');
          openMenu(false);
          clearError();
        });
      });
    }catch(err){
      showError('Could not load names — please refresh.');
    }
  }

  /* ---------- errors ---------- */
  const errorEl = document.getElementById('form-error');
  function showError(t){ errorEl.textContent = t; errorEl.hidden = false; }
  function clearError(){ errorEl.hidden = true; }

  /* ---------- reveal ---------- */
  const btn = document.getElementById('reveal-btn');
  btn.addEventListener('click', submit);

  async function submit(){
    const email = document.getElementById('email').value.trim();
    if(!selectedName){ showError('Please select your name.'); openMenu(true); return; }
    if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showError('Please enter a valid email address.'); return; }
    clearError();

    btn.disabled = true;
    btn.querySelector('span').textContent = 'Finding your picks…';

    try{
      const res = await fetch(`${API_URL}/api/get-assignment`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ name:selectedName, email })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Failed to get assignment');
      showReveal(data.recipient1, data.recipient2);
    }catch(err){
      showError(err.message && /already|used|claim/i.test(err.message) ? err.message : 'Something went wrong — please try again.');
      btn.disabled = false;
      btn.querySelector('span').textContent = 'Reveal my picks';
    }
  }

  function showReveal(r1, r2){
    document.getElementById('name1').textContent = r1;
    document.getElementById('name2').textContent = r2;
    document.getElementById('form-section').hidden = true;
    const rev = document.getElementById('reveal-section');
    rev.hidden = false;
    rev.classList.add('fade-in');
    document.querySelectorAll('.flip').forEach(f=>{
      const flipIt = ()=>flip(f);
      f.addEventListener('click', flipIt);
      f.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flipIt(); } });
    });
  }

  function flip(card){
    if(card.classList.contains('flipped')) return;
    card.classList.add('flipped');
    flippedCount++;
    if(flippedCount === 2){
      const hint = document.getElementById('hint');
      hint.style.opacity = '0';
      setTimeout(()=>{
        hint.hidden = true;
        document.getElementById('merry').textContent = `Merry Christmas, ${selectedName}`;
        const c = document.getElementById('confirm');
        c.hidden = false;
        requestAnimationFrame(()=>c.classList.add('show'));
      }, 320);
    }
  }

  loadFamily();
</script>
</body>
</html>
